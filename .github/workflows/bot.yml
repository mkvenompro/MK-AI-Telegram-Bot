name: MK AI - Deploy to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mk-ai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Convert the GitHub secret into a valid OpenSSH key.
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          # Verify that the private key is readable.
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"

          # Trust the server host key.
          ssh-keyscan -H 94.237.93.1 >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH key verified successfully."

      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "echo 'SSH connection OK'; hostname; whoami"

      - name: Deploy bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENCODE_URL: ${{ secrets.OPENCODE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || '' }}
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "mkdir -p /opt/mk-ai-bot"

          tar \
            --exclude='.git' \
            --exclude='data/memory.json' \
            -czf /tmp/mk-ai-bot.tar.gz .

          scp \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            /tmp/mk-ai-bot.tar.gz \
            root@94.237.93.1:/tmp/mk-ai-bot.tar.gz

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "cd /opt/mk-ai-bot && tar -xzf /tmp/mk-ai-bot.tar.gz && rm -f /tmp/mk-ai-bot.tar.gz"

          # Create environment file on the server.
          # Values are passed through SSH stdin so they are not
          # written into the workflow command itself.
          cat > /tmp/mk-ai-env <<EOF
          TELEGRAM_BOT_TOKEN=$BOT_TOKEN
          AI_API_URL=$OPENCODE_URL
          AI_API_KEY=$OPENCODE_API_KEY
          AI_MODEL=$OPENCODE_MODEL
          MAX_HISTORY=12
          MAX_MESSAGE_LENGTH=4000
          EOF

          scp \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            /tmp/mk-ai-env \
            root@94.237.93.1:/opt/mk-ai-bot/.env

          rm -f /tmp/mk-ai-env

      - name: Install dependencies and create service
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/mk-ai-bot

          apt-get update
          apt-get install -y python3 python3-venv python3-pip

          if [ ! -d /opt/mk-ai-bot/venv ]; then
              python3 -m venv /opt/mk-ai-bot/venv
          fi

          /opt/mk-ai-bot/venv/bin/pip install --upgrade pip
          /opt/mk-ai-bot/venv/bin/pip install -r requirements.txt

          chmod 600 /opt/mk-ai-bot/.env

          cat > /etc/systemd/system/mk-ai-bot.service <<'SERVICE'
          [Unit]
          Description=MK AI Telegram Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/mk-ai-bot
          EnvironmentFile=/opt/mk-ai-bot/.env
          ExecStart=/opt/mk-ai-bot/venv/bin/python /opt/mk-ai-bot/bot.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable mk-ai-bot.service
          systemctl restart mk-ai-bot.service

          sleep 3

          systemctl --no-pager --full status mk-ai-bot.service || true

          echo "========================================"
          echo "MK AI BOT DEPLOYED"
          echo "========================================"
          REMOTE

      - name: Check bot
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "systemctl is-active --quiet mk-ai-bot.service && echo 'MK AI Bot is RUNNING'"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/id_ed25519.pub"
          rm -f "$HOME/.ssh/known_hosts"
          rm -f /tmp/mk-ai-bot.tar.gz
