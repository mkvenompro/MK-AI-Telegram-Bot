name: MK AI Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::BOT_TOKEN secret is missing."
            exit 1
          fi

          echo "BOT_TOKEN secret is present."

      - name: Test Telegram API
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "Testing Telegram API..."

          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getMe"

          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = r.read().decode()
                  print("Telegram API HTTP:", r.status)
                  print("Telegram API reachable.")
                  print("Response received:", data[:500])

          except Exception as e:
              print("Telegram API connection failed:")
              print(type(e).__name__, str(e))
              raise
          PY

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
