name: MK AI - Deploy to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mk-ai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write the private key exactly as stored in GitHub Secrets
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          # Verify that the private key is valid
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"

          # Trust the server host key
          ssh-keyscan -H 94.237.93.1 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH key configured successfully."

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "echo 'SSH CONNECTION OK'; hostname; whoami"

      - name: Deploy repository
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            'bash -s' <<'REMOTE'
          set -e

          APP_DIR="/root/MK-AI-Telegram-Bot"

          echo "========================================"
          echo "MK AI SERVER DEPLOY"
          echo "========================================"

          if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository does not exist. Cloning..."
              rm -rf "$APP_DIR"

              git clone \
                https://github.com/mkvenompro/MK-AI-Telegram-Bot.git \
                "$APP_DIR"
          else
              echo "Repository exists. Updating..."

              cd "$APP_DIR"

              git fetch origin main
              git reset --hard origin/main
              git clean -fd
          fi

          cd "$APP_DIR"

          echo
          echo "Installing system dependencies..."

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y
          apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            git

          echo
          echo "Creating virtual environment..."

          if [ ! -d ".venv" ]; then
              python3 -m venv .venv
          fi

          .venv/bin/python -m pip install --upgrade pip

          echo
          echo "Installing Python requirements..."

          .venv/bin/pip install -r requirements.txt

          echo
          echo "Creating data directory..."

          mkdir -p data

          echo
          echo "Creating environment file..."

          if [ ! -f ".env" ]; then
              touch .env
              chmod 600 .env
          fi

          echo
          echo "========================================"
          echo "DEPLOY COMPLETE"
          echo "========================================"

          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse --short HEAD

          echo
          echo "Python:"
          .venv/bin/python --version

          echo
          echo "Files:"
          ls -lah

          REMOTE

      - name: Update server environment
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENCODE_URL: ${{ secrets.OPENCODE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "cat > /root/MK-AI-Telegram-Bot/.env" <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          AI_API_URL=${OPENCODE_URL}
          AI_API_KEY=${OPENCODE_API_KEY}
          AI_MODEL=${OPENCODE_MODEL}
          MAX_HISTORY=12
          MAX_MESSAGE_LENGTH=4000
          EOF

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "chmod 600 /root/MK-AI-Telegram-Bot/.env"

      - name: Install systemd service
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            'bash -s' <<'REMOTE'
          set -e

          APP_DIR="/root/MK-AI-Telegram-Bot"

          cat > /etc/systemd/system/mk-ai-telegram.service <<EOF
          [Unit]
          Description=MK AI Telegram Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=$APP_DIR
          ExecStart=$APP_DIR/.venv/bin/python $APP_DIR/bot.py
          Restart=always
          RestartSec=5

          EnvironmentFile=$APP_DIR/.env

          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload

          systemctl enable mk-ai-telegram.service
          systemctl restart mk-ai-telegram.service

          sleep 3

          echo
          echo "========================================"
          echo "SERVICE STATUS"
          echo "========================================"

          systemctl --no-pager --full status mk-ai-telegram.service || true

          echo
          echo "========================================"
          echo "RECENT LOGS"
          echo "========================================"

          journalctl \
            -u mk-ai-telegram.service \
            -n 30 \
            --no-pager || true

          REMOTE

      - name: Final server check
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            'systemctl is-active --quiet mk-ai-telegram.service && echo "MK AI BOT IS RUNNING"'
