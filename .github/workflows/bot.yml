name: MK AI Telegram Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "*/30 * * * *"

jobs:
  bot:
    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_URL: https://openrouter.ai/api/v1/chat/completions
      AI_MODEL: qwen/qwen3-30b-a3b:free
      MAX_HISTORY: 12
      MAX_MESSAGE_LENGTH: 4000

    steps:
      - name: Test Telegram API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "========================================"
          echo "Testing connection to Telegram API..."
          echo "========================================"

          curl -4             --connect-timeout 15             --max-time 30             --fail-with-body             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"

          echo ""
          echo "Telegram API connection test completed."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Telegram Bot
        run: |
          python bot.py
