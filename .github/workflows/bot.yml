GitHub Actions — MK AI Server Deployment

name: MK AI - Deploy to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mk-ai-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SERVER_HOST: 94.237.93.1
      SERVER_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write the private key exactly as stored in GitHub Secrets.
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          # Validate that OpenSSH can actually read the key.
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /tmp/public_key

          echo "SSH private key format: OK"

          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -i "$HOME/.ssh/id_ed25519" \
            "$SERVER_USER@$SERVER_HOST" \
            'echo "SSH connection successful"; hostname; id'

      - name: Deploy repository to server
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -i "$HOME/.ssh/id_ed25519" \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_DIR="/root/MK-AI-Telegram-Bot"

          echo "========================================"
          echo "MK AI SERVER DEPLOY"
          echo "========================================"

          if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not found. Cloning..."

              rm -rf "$APP_DIR"

              git clone \
                https://github.com/mkvenompro/MK-AI-Telegram-Bot.git \
                "$APP_DIR"
          else
              echo "Repository exists. Updating..."

              cd "$APP_DIR"

              git fetch origin main
              git reset --hard origin/main
              git clean -fd
          fi

          cd "$APP_DIR"

          echo
          echo "Installing system dependencies..."

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            git

          echo
          echo "Creating virtual environment..."

          if [ ! -d ".venv" ]; then
              python3 -m venv .venv
          fi

          source .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          echo
          echo "Checking environment..."

          if [ ! -f ".env" ]; then
              echo "WARNING: .env does not exist."
              echo "Create /root/MK-AI-Telegram-Bot/.env on the server."
          else
              chmod 600 .env
              echo ".env found."
          fi

          echo
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          REMOTE_SCRIPT

      - name: Restart MK AI bot
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -i "$HOME/.ssh/id_ed25519" \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_DIR="/root/MK-AI-Telegram-Bot"
          SERVICE_NAME="mk-ai-bot"

          cd "$APP_DIR"

          echo "Creating systemd service..."

          cat > "/etc/systemd/system/${SERVICE_NAME}.service" <<EOF
          [Unit]
          Description=MK AI Telegram Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=${APP_DIR}
          ExecStart=${APP_DIR}/.venv/bin/python ${APP_DIR}/bot.py
          Restart=always
          RestartSec=5

          EnvironmentFile=${APP_DIR}/.env

          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable "$SERVICE_NAME"
          systemctl restart "$SERVICE_NAME"

          sleep 3

          echo
          echo "========================================"
          echo "SERVICE STATUS"
          echo "========================================"

          systemctl --no-pager --full status "$SERVICE_NAME" || true

          echo
          echo "========================================"
          echo "RECENT LOGS"
          echo "========================================"

          journalctl \
            -u "$SERVICE_NAME" \
            -n 30 \
            --no-pager || true

          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f /tmp/public_key
