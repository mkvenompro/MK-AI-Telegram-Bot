name: MK AI - Deploy to Server

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mk-ai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ------------------------------------------
      # Checkout repository
      # ------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup SSH
      # ------------------------------------------

      - name: Setup SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          echo "SSH configured."

      # ------------------------------------------
      # Deploy
      # ------------------------------------------

      - name: Deploy to server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |

          set -e

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -s' <<'REMOTE'

          set -e

          REPO="/root/MK-AI-Telegram-Bot"

          echo "========================================"
          echo " MK AI SERVER DEPLOY"
          echo "========================================"

          # --------------------------------------
          # Clone if repository doesn't exist
          # --------------------------------------

          if [ ! -d "$REPO/.git" ]; then

              echo "[+] Repository not found."
              echo "[+] Cloning..."

              git clone \
                https://github.com/mkvenompro/MK-AI-Telegram-Bot.git \
                "$REPO"

          fi

          cd "$REPO"

          # --------------------------------------
          # Update repository
          # --------------------------------------

          echo "[+] Updating repository..."

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # --------------------------------------
          # Python environment
          # --------------------------------------

          echo "[+] Preparing Python..."

          if [ ! -d ".venv" ]; then
              python3 -m venv .venv
          fi

          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --upgrade pip

          .venv/bin/pip install \
            --disable-pip-version-check \
            -r requirements.txt

          # --------------------------------------
          # Ensure data directory
          # --------------------------------------

          mkdir -p data

          # --------------------------------------
          # Restart OpenCode
          # --------------------------------------

          if systemctl list-unit-files \
              | grep -q '^opencode.service'; then

              echo "[+] Restarting OpenCode..."

              systemctl restart opencode

              sleep 3

              if ! systemctl is-active --quiet opencode; then
                  echo "[ERROR] OpenCode failed."
                  systemctl status opencode --no-pager
                  exit 1
              fi

              echo "[OK] OpenCode is running."

          else

              echo "[WARNING] opencode.service does not exist."

          fi

          # --------------------------------------
          # Check OpenCode API
          # --------------------------------------

          if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://127.0.0.1:4096/global/health \
              >/tmp/opencode-health.json; then

              echo "[OK] OpenCode API:"
              cat /tmp/opencode-health.json

          else

              echo "[ERROR] OpenCode API unavailable."
              exit 1

          fi

          # --------------------------------------
          # Restart Telegram Bot
          # --------------------------------------

          echo "[+] Restarting MK AI..."

          systemctl restart mk-ai

          sleep 3

          if ! systemctl is-active --quiet mk-ai; then

              echo "[ERROR] MK AI bot failed."

              systemctl status mk-ai --no-pager

              echo
              echo "===== BOT LOG ====="

              journalctl \
                -u mk-ai \
                -n 100 \
                --no-pager

              exit 1

          fi

          echo "[OK] MK AI bot is running."

          # --------------------------------------
          # Final status
          # --------------------------------------

          echo
          echo "========================================"
          echo " DEPLOY SUCCESS"
          echo "========================================"

          echo
          echo "OpenCode:"
          systemctl is-active opencode || true

          echo
          echo "MK AI:"
          systemctl is-active mk-ai || true

          echo
          echo "Commit:"
          git rev-parse --short HEAD

          echo
          echo "Server:"
          hostname

          echo
          echo "========================================"

          REMOTE

      # ------------------------------------------
      # Done
      # ------------------------------------------

      - name: Deployment complete
        run: |
          echo "========================================"
          echo " GitHub deployment finished."
          echo " Server services remain running."
          echo "========================================"
