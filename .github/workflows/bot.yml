name: MK AI - Deploy to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mk-ai-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: 94.237.93.1
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write private key exactly as stored in GitHub Secrets
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          # Validate private key before trying SSH
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" \
            > "$HOME/.ssh/id_ed25519.pub"

          ssh-keyscan -H "$SERVER_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH key loaded successfully."

      - name: Test SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "echo 'SSH connection OK'; hostname; whoami"

      - name: Deploy MK AI Bot
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_DIR="/root/MK-AI-Telegram-Bot"
          REPO="https://github.com/mkvenompro/MK-AI-Telegram-Bot.git"

          echo "========================================"
          echo "MK AI SERVER DEPLOY"
          echo "========================================"

          echo
          echo "[1/7] Installing required packages..."

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y \
            git \
            python3 \
            python3-venv \
            python3-pip

          echo
          echo "[2/7] Preparing repository..."

          if [ ! -d "$APP_DIR/.git" ]; then

              rm -rf "$APP_DIR"

              git clone "$REPO" "$APP_DIR"

          else

              cd "$APP_DIR"

              git fetch origin

              git reset --hard origin/main

              git clean -fd

          fi

          cd "$APP_DIR"

          echo
          echo "[3/7] Creating Python environment..."

          if [ ! -d ".venv" ]; then
              python3 -m venv .venv
          fi

          .venv/bin/python -m pip install --upgrade pip

          .venv/bin/pip install -r requirements.txt

          echo
          echo "[4/7] Checking environment..."

          if [ ! -f ".env" ]; then
              echo
              echo "ERROR: /root/MK-AI-Telegram-Bot/.env does not exist."
              echo "Create the .env file on the server first."
              exit 1
          fi

          echo
          echo "[5/7] Creating systemd service..."

          cat > /etc/systemd/system/mk-ai-telegram-bot.service <<'SERVICE'
          [Unit]
          Description=MK AI Telegram Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple

          User=root
          Group=root

          WorkingDirectory=/root/MK-AI-Telegram-Bot

          EnvironmentFile=/root/MK-AI-Telegram-Bot/.env

          ExecStart=/root/MK-AI-Telegram-Bot/.venv/bin/python /root/MK-AI-Telegram-Bot/bot.py

          Restart=always
          RestartSec=5

          KillSignal=SIGINT

          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SERVICE

          echo
          echo "[6/7] Restarting MK AI..."

          systemctl daemon-reload

          systemctl enable mk-ai-telegram-bot.service

          systemctl restart mk-ai-telegram-bot.service

          sleep 3

          echo
          echo "[7/7] Checking service..."

          systemctl --no-pager --full status mk-ai-telegram-bot.service || true

          echo
          echo "========================================"
          echo "DEPLOY FINISHED"
          echo "========================================"

          REMOTE_SCRIPT

      - name: Verify bot service
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            root@94.237.93.1 \
            "systemctl is-active --quiet mk-ai-telegram-bot.service"

          echo "MK AI Telegram Bot is running."

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/id_ed25519.pub"

          echo "SSH key removed from GitHub runner."
