name: MK AI - Deploy to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mk-ai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

          echo "SSH configured."

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "$SERVER_USER@$SERVER_HOST" \
            'echo SSH_CONNECTION_OK'

      - name: Deploy and start MK AI
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_API_URL: ${{ secrets.OPENCODE_URL }}
          AI_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Connecting to server"
          echo "========================================"

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "$SERVER_USER@$SERVER_HOST" \
            "TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' \
             AI_API_KEY='$AI_API_KEY' \
             AI_API_URL='$AI_API_URL' \
             AI_MODEL='$AI_MODEL' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          REPO_DIR="/root/MK-AI-Telegram-Bot"

          echo "========================================"
          echo "Updating repository"
          echo "========================================"

          if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/mkvenompro/MK-AI-Telegram-Bot.git "$REPO_DIR"
          fi

          cd "$REPO_DIR"

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          echo "========================================"
          echo "Installing system dependencies"
          echo "========================================"

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y \
              python3 \
              python3-venv \
              python3-pip \
              build-essential

          echo "========================================"
          echo "Creating virtual environment"
          echo "========================================"

          if [ ! -d ".venv" ]; then
              python3 -m venv .venv
          fi

          .venv/bin/python -m ensurepip --upgrade || true
          .venv/bin/python -m pip install --upgrade pip

          echo "========================================"
          echo "Installing requirements"
          echo "========================================"

          .venv/bin/python -m pip install -r requirements.txt

          echo "========================================"
          echo "Creating environment file"
          echo "========================================"

          umask 077

          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          AI_API_KEY=${AI_API_KEY}
          AI_API_URL=${AI_API_URL}
          AI_MODEL=${AI_MODEL}
          MAX_HISTORY=12
          MAX_MESSAGE_LENGTH=4000
          EOF

          chmod 600 .env

          echo "========================================"
          echo "Stopping old MK AI process"
          echo "========================================"

          if [ -f "mk-ai.pid" ]; then
              OLD_PID="$(cat mk-ai.pid || true)"

              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                  kill "$OLD_PID" || true
                  sleep 2
              fi

              rm -f mk-ai.pid
          fi

          pkill -f "python.*bot.py" || true
          sleep 2

          echo "========================================"
          echo "Starting MK AI"
          echo "========================================"

          nohup .venv/bin/python bot.py \
              > mk-ai.log 2>&1 < /dev/null &

          BOT_PID=$!

          echo "$BOT_PID" > mk-ai.pid

          sleep 5

          echo "Bot PID: $BOT_PID"

          echo "========================================"
          echo "Checking MK AI"
          echo "========================================"

          if kill -0 "$BOT_PID" 2>/dev/null; then
              echo "========================================"
              echo "MK AI STARTED SUCCESSFULLY"
              echo "========================================"
          else
              echo "========================================"
              echo "MK AI FAILED TO START"
              echo "========================================"

              echo "===== LAST 100 LOG LINES ====="

              tail -n 100 mk-ai.log || true

              exit 1
          fi

          echo "========================================"
          echo "Deployment completed"
          echo "========================================"

          REMOTE_SCRIPT
