name: MK AI Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: Force Telegram API IPv4
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "FORCING TELEGRAM API TO IPv4"
          echo "========================================"

          TELEGRAM_IPV4="149.154.166.110"

          echo "Telegram IPv4: $TELEGRAM_IPV4"

          # Remove old Telegram hosts entries if any
          sudo sed -i '/api\.telegram\.org/d' /etc/hosts || true

          # Force hostname to IPv4
          echo "$TELEGRAM_IPV4 api.telegram.org" | sudo tee -a /etc/hosts

          echo
          echo "Hosts:"
          grep "api.telegram.org" /etc/hosts || true

          echo
          echo "DNS:"
          getent hosts api.telegram.org || true

          echo
          echo "Testing HTTPS over IPv4..."

          curl -4 \
            --connect-timeout 10 \
            --max-time 20 \
            --fail \
            -sS \
            https://api.telegram.org/ \
            -o /tmp/telegram_test.html

          echo
          echo "Telegram IPv4 connection: OK"
          echo
      - name: Configure Python networking
        shell: bash
        run: |
          echo "========================================"
          echo "PYTHON NETWORK CONFIG"
          echo "========================================"

          # Prefer IPv4 when Python resolves Telegram API.
          echo "RES_OPTIONS=single-request-reopen" >> "$GITHUB_ENV"

          # Disable HTTP proxy variables if they interfere.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy

          echo "Network environment configured."
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::BOT_TOKEN secret is missing."
            exit 1
          fi

          echo "BOT_TOKEN secret is present."

      - name: Test Telegram API
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "Testing Telegram API..."

          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getMe"

          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = r.read().decode()
                  print("Telegram API HTTP:", r.status)
                  print("Telegram API reachable.")
                  print("Response received:", data[:500])

          except Exception as e:
              print("Telegram API connection failed:")
              print(type(e).__name__, str(e))
              raise
          PY

      - name: Run bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
