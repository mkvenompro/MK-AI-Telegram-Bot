name: MK AI - Deploy to Server

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mk-ai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # Setup SSH
      # ========================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURING SSH"
          echo "========================================"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -z "${SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY_B64 secret is missing."
            exit 1
          fi

          if [ -z "${SERVER_HOST:-}" ]; then
            echo "::error::SERVER_HOST secret is missing."
            exit 1
          fi

          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | base64 --decode \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/id_ed25519" \
            > "$HOME/.ssh/id_ed25519.pub"

          echo "SSH private key is valid."


      # ========================================
      # Configure known hosts
      # ========================================

      - name: Configure known hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

        shell: bash

        run: |
          set -euo pipefail

          ssh-keyscan \
            -T 20 \
            -H \
            "$SERVER_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Known host configured."


      # ========================================
      # Test SSH
      # ========================================

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo "TESTING SSH CONNECTION"
          echo "========================================"

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            "root@$SERVER_HOST" \
            "echo SSH_CONNECTION_OK && hostname && whoami"


      # ========================================
      # Deploy
      # ========================================

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING DEPLOYMENT"
          echo "========================================"

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          # Encode only the Telegram token.
          ENV_B64="$(
            printf '%s\n' \
              "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            | base64 -w 0
          )"

          echo "========================================"
          echo "CONNECTING TO SERVER"
          echo "========================================"

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            "root@$SERVER_HOST" \
            "ENV_B64='$ENV_B64' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail


          # ======================================
          # Variables
          # ======================================

          REPO_DIR="/root/MK-AI-Telegram-Bot"
          VENV_DIR="$REPO_DIR/.venv"
          ENV_FILE="$REPO_DIR/.env"
          LOG_FILE="/root/mk-ai-bot.log"
          PID_FILE="/root/mk-ai-bot.pid"


          echo "========================================"
          echo "MK AI SERVER DEPLOYMENT"
          echo "========================================"

          echo
          echo "Server:"
          hostname

          echo
          echo "User:"
          whoami


          # ======================================
          # Update repository
          # ======================================

          echo
          echo "========================================"
          echo "UPDATING REPOSITORY"
          echo "========================================"

          if [ ! -d "$REPO_DIR/.git" ]; then

              echo "Repository does not exist."
              echo "Cloning repository..."

              cd /root

              git clone \
                https://github.com/mkvenompro/MK-AI-Telegram-Bot.git \
                MK-AI-Telegram-Bot

          fi

          cd "$REPO_DIR"

          git fetch origin main

          git reset --hard origin/main

          echo
          echo "Current commit:"

          git rev-parse --short HEAD


          # ======================================
          # Configure Telegram token
          # ======================================

          echo
          echo "========================================"
          echo "CONFIGURING TELEGRAM TOKEN"
          echo "========================================"

          printf '%s' "$ENV_B64" \
            | base64 --decode \
            > "$ENV_FILE"

          chmod 600 "$ENV_FILE"

          echo "Telegram environment configured."


          # ======================================
          # IMPORTANT:
          # OpenCode configuration stays untouched.
          #
          # We do NOT create:
          # AI_API_KEY
          # AI_API_URL
          # AI_MODEL
          #
          # The bot/server keeps using its existing
          # OpenCode configuration.
          # ======================================


          # ======================================
          # Install Python
          # ======================================

          echo
          echo "========================================"
          echo "INSTALLING PYTHON"
          echo "========================================"

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            build-essential


          # ======================================
          # Virtual environment
          # ======================================

          echo
          echo "========================================"
          echo "CREATING VIRTUAL ENVIRONMENT"
          echo "========================================"

          if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv "$VENV_DIR"
          fi


          # ======================================
          # Update pip
          # ========================================

          echo
          echo "========================================"
          echo "UPDATING PIP"
          echo "========================================"

          "$VENV_DIR/bin/python" \
            -m pip install \
            --upgrade pip


          # ======================================
          # Install requirements
          # ========================================

          echo
          echo "========================================"
          echo "INSTALLING REQUIREMENTS"
          echo "========================================"

          "$VENV_DIR/bin/python" \
            -m pip install \
            -r requirements.txt


          # ======================================
          # Stop old bot
          # ========================================

          echo
          echo "========================================"
          echo "STOPPING OLD MK AI PROCESS"
          echo "========================================"

          if [ -f "$PID_FILE" ]; then

              OLD_PID="$(cat "$PID_FILE" 2>/dev/null || true)"

              if [ -n "$OLD_PID" ]; then

                  if kill -0 "$OLD_PID" 2>/dev/null; then

                      echo "Stopping old PID: $OLD_PID"

                      kill "$OLD_PID" 2>/dev/null || true

                      sleep 3

                  fi

              fi

              rm -f "$PID_FILE"

          fi


          # ======================================
          # Kill old bot processes from this repo
          # ======================================

          OLD_PIDS="$(
              ps -eo pid,args \
              | grep '[p]ython.*bot.py' \
              | grep "$REPO_DIR" \
              | awk '{print $1}' \
              || true
          )"

          if [ -n "$OLD_PIDS" ]; then

              echo "Old bot processes found:"
              echo "$OLD_PIDS"

              kill $OLD_PIDS 2>/dev/null || true

              sleep 3

              for PID in $OLD_PIDS; do

                  if kill -0 "$PID" 2>/dev/null; then
                      kill -9 "$PID" 2>/dev/null || true
                  fi
              done

          fi


          # ======================================
          # Start MK AI
          # ======================================

          echo
          echo "========================================"
          echo "STARTING MK AI"
          echo "========================================"

          cd "$REPO_DIR"

          nohup \
            "$VENV_DIR/bin/python" \
            bot.py \
            > "$LOG_FILE" \
            2>&1 < /dev/null &

          BOT_PID=$!

          echo "$BOT_PID" > "$PID_FILE"

          echo "Bot PID: $BOT_PID"


          # ======================================
          # Check startup
          # ======================================

          sleep 5

          echo
          echo "========================================"
          echo "CHECKING MK AI"
          echo "========================================"

          if kill -0 "$BOT_PID" 2>/dev/null; then

              echo "MK AI process is running."

          else

              echo "MK AI failed to start."

              echo
              echo "===== LAST 100 LOG LINES ====="

              tail -100 "$LOG_FILE" || true

              exit 1

          fi


          # ======================================
          # Show process
          # ======================================

          echo
          echo "========================================"
          echo "MK AI PROCESS"
          echo "========================================"

          ps aux | grep '[p]ython.*bot.py' || true


          # ======================================
          # Show logs
          # ======================================

          echo
          echo "========================================"
          echo "MK AI LOG"
          echo "========================================"

          tail -30 "$LOG_FILE" || true


          # ======================================
          # Success
          # ========================================

          echo
          echo "========================================"
          echo "DEPLOY SUCCESS"
          echo "========================================"

          echo "Repository:"
          echo "$REPO_DIR"

          echo
          echo "Python:"
          "$VENV_DIR/bin/python" --version

          echo
          echo "Bot PID:"
          echo "$BOT_PID"

          echo
          echo "OpenCode:"
          echo "Existing server OpenCode configuration is untouched."

          echo
          echo "MK AI is running on the server."

          REMOTE_SCRIPT


      # ========================================
      # Complete
      # ========================================

      - name: Deployment complete
        shell: bash

        run: |
          echo "========================================"
          echo "MK AI DEPLOYMENT COMPLETE"
          echo "========================================"

          echo "The bot is running on the VPS."
          echo "GitHub Actions deployment finished."
