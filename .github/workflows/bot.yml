name: MK AI - Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mk-ai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -z "${SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY_B64 is empty"
            exit 1
          fi

          if [ -z "${SERVER_HOST:-}" ]; then
            echo "::error::SERVER_HOST is empty"
            exit 1
          fi

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "Checking private key..."

          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"

          echo "Private key is valid."

          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "root@$SERVER_HOST" \
            "echo SSH_CONNECTION_OK"

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "root@$SERVER_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          cd /root/MK-AI-Telegram-Bot

          echo "Updating repository..."

          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."

          python3 -m pip install -r requirements.txt

          echo "Restarting MK AI..."

          pkill -f "python3 bot.py" || true

          nohup python3 bot.py > /root/mk-ai-bot.log 2>&1 &

          sleep 2

          if pgrep -f "python3 bot.py" >/dev/null; then
              echo "MK AI started successfully."
          else
              echo "MK AI failed to start."
              tail -100 /root/mk-ai-bot.log || true
              exit 1
          fi

          REMOTE_SCRIPT
