cat > ~/fix_bot_yaml_groq.py <<'PY'
import os
import json
import base64
import subprocess
import sys

REPO = "mkvenompro/MK-AI-Telegram-Bot"
BRANCH = "main"
FILE = ".github/workflows/bot.yml"

TOKEN = os.environ.get("GITHUB_TOKEN", "").strip()

if not TOKEN:
    print("❌ GITHUB_TOKEN غير موجود")
    sys.exit(1)

API = "https://api.github.com"

HEADERS = [
    "-H", f"Authorization: Bearer {TOKEN}",
    "-H", "Accept: application/vnd.github+json",
    "-H", "X-GitHub-Api-Version: 2022-11-28",
]

def curl(args, data=None):
    result = subprocess.run(
        ["curl", "-sS"] + HEADERS + args,
        input=data,
        text=True,
        capture_output=True
    )

    if result.returncode != 0:
        print(result.stderr)
        sys.exit(1)

    return result.stdout


# ============================================================
# Download current bot.yml
# ============================================================

print("📥 Downloading bot.yml...")

url = f"{API}/repos/{REPO}/contents/{FILE}?ref={BRANCH}"

raw = curl([url])

try:
    data = json.loads(raw)
except Exception:
    print("❌ GitHub returned invalid JSON:")
    print(raw[:2000])
    sys.exit(1)

if "content" not in data:
    print("❌ Failed reading bot.yml")
    print(json.dumps(data, indent=2))
    sys.exit(1)

sha = data["sha"]

old_content = base64.b64decode(
    data["content"].replace("\n", "")
).decode("utf-8")

print(f"✅ bot.yml loaded: {len(old_content)} bytes")


# ============================================================
# Backup
# ============================================================

backup = "/data/data/com.termux/files/home/bot.yml.backup"

with open(backup, "w", encoding="utf-8") as f:
    f.write(old_content)

print(f"💾 Backup saved: {backup}")


# ============================================================
# Correct bot.yml
# ============================================================

new_content = r'''name: MK AI Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_API_URL: https://api.groq.com/openai/v1/chat/completions
      AI_MODEL: openai/gpt-oss-120b

    timeout-minutes: 360

    steps:
      - name: Force Telegram API IPv4
        shell: bash
        run: |
          set -eux

          TELEGRAM_IPV4="149.154.166.110"

          sudo sed -i '/api\.telegram\.org/d' /etc/hosts || true
          echo "$TELEGRAM_IPV4 api.telegram.org" | sudo tee -a /etc/hosts

          echo "Telegram IPv4: $TELEGRAM_IPV4"

          getent hosts api.telegram.org || true

          curl -4 \
            --connect-timeout 10 \
            --max-time 20 \
            --fail \
            -sS \
            https://api.telegram.org/ \
            -o /tmp/telegram_test.html

          echo "Telegram IPv4 connection: OK"

      - name: Configure Python networking
        shell: bash
        run: |
          echo "RES_OPTIONS=single-request-reopen" >> "$GITHUB_ENV"

          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy

          echo "Network environment configured."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::BOT_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "$AI_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is missing."
            exit 1
          fi

          echo "BOT_TOKEN secret is present."
          echo "GROQ_API_KEY secret is present."
          echo "AI provider: Groq"
          echo "AI model: $AI_MODEL"
          echo "AI endpoint: $AI_API_URL"

      - name: Test Telegram API
        run: |
          echo "Testing Telegram API..."

          python - <<'PY'
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getMe"

          with urllib.request.urlopen(url, timeout=20) as r:
              data = r.read().decode()

          print("Telegram API HTTP:", r.status)
          print("Telegram API reachable.")
          print("Response received:", data[:500])
          PY

      - name: Test Groq API
        run: |
          echo "Testing Groq API..."

          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["AI_API_KEY"]
          url = os.environ["AI_API_URL"]
          model = os.environ["AI_MODEL"]

          payload = {
              "model": model,
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly: GROQ_OK"
                  }
              ],
              "temperature": 0,
              "max_tokens": 20
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read().decode("utf-8")

              print("Groq API HTTP:", response.status)

              result = json.loads(body)

              if "choices" not in result:
                  print(body[:2000])
                  raise RuntimeError("Invalid Groq response")

              print("Groq API test: OK")

          except urllib.error.HTTPError as e:
              body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("❌ Groq API HTTP:", e.code)
              print(body[:2000])
              raise

      - name: Run bot
        run: |
          echo "========================================"
          echo "Starting MK AI Telegram Bot"
          echo "========================================"
          echo "Provider: Groq"
          echo "Model: $AI_MODEL"
          echo "Endpoint: $AI_API_URL"
          echo "========================================"

          python bot.py
'''


# ============================================================
# Upload
# ============================================================

print()
print("📤 Uploading corrected bot.yml...")

body = {
    "message": "fix: repair bot workflow for Groq",
    "content": base64.b64encode(
        new_content.encode("utf-8")
    ).decode("ascii"),
    "sha": sha,
    "branch": BRANCH,
}

raw = curl(
    [
        "-X", "PUT",
        "-H", "Content-Type: application/json",
        "--data-binary", "@-",
        f"{API}/repos/{REPO}/contents/{FILE}",
    ],
    json.dumps(body)
)

try:
    result = json.loads(raw)
except Exception:
    print("❌ Invalid GitHub response:")
    print(raw[:3000])
    sys.exit(1)

if "content" not in result:
    print("❌ Upload failed:")
    print(json.dumps(result, indent=2))
    sys.exit(1)

print()
print("=" * 60)
print("✅ bot.yml FIXED")
print("=" * 60)
print()
print("Provider : Groq")
print("Model    : openai/gpt-oss-120b")
print("Endpoint : https://api.groq.com/openai/v1/chat/completions")
print()
print("Only .github/workflows/bot.yml was modified.")
print(f"Backup: {backup}")
print()
print("Run GitHub Actions again.")
PY

python ~/fix_bot_yaml_groq.py
